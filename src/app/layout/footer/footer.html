<footer class="footer">
  <div class="container inner">
    <p class="copy">&copy; {{ year }} {{ name }}. Built with Angular.</p>

    <ul class="social">
      @for (item of social; track item.label) {
        <li>
          <a
            [href]="item.url"
            [attr.target]="isExternal(item.url) ? '_blank' : null"
            [attr.rel]="isExternal(item.url) ? 'noopener noreferrer' : null"
            >{{ item.label }}@if (isExternal(item.url)) {<span class="sr-only"> (opens in a new tab)</span>}</a
          >
        </li>
      }
    </ul>

    <a class="top" href="#home">Back to top</a>
  </div>
</footer>
